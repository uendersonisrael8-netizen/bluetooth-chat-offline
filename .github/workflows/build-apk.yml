name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Cache Node_modules
      uses: actions/cache@v3
      with:
        path: bluetooth-chat/node_modules
        key: bluetooth-chat-node-modules-${{ hashFiles('bluetooth-chat/package-lock.json') }}
        restore-keys: |
          bluetooth-chat-node-modules-

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: true

    - name: Accept Android licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
      env:
        ANDROID_SDK_ROOT: ${{ runner.temp }}/android
        ANDROID_HOME: ${{ runner.temp }}/android

    - name: Install dependencies
      working-directory: ./bluetooth-chat
      run: npm install

    - name: Add Android platform
      working-directory: ./bluetooth-chat
      run: cordova platform add android

    - name: Build Android APK
      working-directory: ./bluetooth-chat
      run: |
        export ANDROID_HOME=$ANDROID_HOME
        export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
        cordova build android --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bluetooth-chat-apk
        path: bluetooth-chat/platforms/android/app/build/outputs/apk/debug/app-debug.apk